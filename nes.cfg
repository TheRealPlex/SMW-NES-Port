MEMORY {
 HEADER: start=$0000, size=$0010, file=%O, fill=yes;
 PRGLO: start=$8000, size=$C000, file=%O, fill=yes, fillval=$FF;
 PRG: start=$C000, size=$3FFA, file=%O, fill=yes, fillval=$FF;
 VECT: start=$FFFA, size=$0006, file=%O, fill=yes;
 CHR: start=$0000, size=$2000, file=%O, fill=yes;
 ZP: start=$0000, size=$0100, type=rw;
 RAM: start=$0300, size=$0500, type=rw;
}
SEGMENTS {
 HEADER: load=HEADER, type=ro;
 UNUSED: load=PRGLO, type=ro, optional=yes;
 CODE: load=PRG, type=ro;
 RODATA: load=PRG, type=ro;
 VECTORS: load=VECT, type=ro;
 CHARS: load=CHR, type=ro;
 ZEROPAGE: load=ZP, type=zp;
 BSS: load=RAM, type=bss, define=yes;
}
