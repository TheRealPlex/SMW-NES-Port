MEMORY {
 HEADER: start=$0000,size=$10,file=%O,fill=yes;
 LEVEL0: start=$8000,size=$2000,file=%O,fill=yes,fillval=$FF;
 LEVEL1: start=$8000,size=$2000,file=%O,fill=yes,fillval=$FF;
 LEVEL2: start=$8000,size=$2000,file=%O,fill=yes,fillval=$FF;
 LEVEL3: start=$8000,size=$2000,file=%O,fill=yes,fillval=$FF;
 STATIC: start=$A000,size=$2000,file=%O,fill=yes,fillval=$FF;
 SPARE: start=$8000,size=$2000,file=%O,fill=yes,fillval=$FF;
 PRG: start=$C000,size=$3FFA,file=%O,fill=yes,fillval=$FF;
 VECT: start=$FFFA,size=6,file=%O,fill=yes;
 CHR: start=0,size=$2000,file=%O,fill=yes;
 ZP: start=0,size=$100,type=rw;
 RAM: start=$0300,size=$500,type=rw;
}
SEGMENTS {
 HEADER: load=HEADER,type=ro;
 LEVEL0: load=LEVEL0,type=ro;
 LEVEL1: load=LEVEL1,type=ro;
 LEVEL2: load=LEVEL2,type=ro;
 LEVEL3: load=LEVEL3,type=ro;
 STATIC: load=STATIC,type=ro;
 CODE: load=PRG,type=ro;
 RODATA: load=PRG,type=ro;
 VECTORS: load=VECT,type=ro;
 CHARS: load=CHR,type=ro;
 ZEROPAGE: load=ZP,type=zp;
 BSS: load=RAM,type=bss,define=yes;
}
